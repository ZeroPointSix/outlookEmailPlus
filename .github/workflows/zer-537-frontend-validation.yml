name: ZER-537 Frontend Validation

on:
  push:
    branches:
      - codex/zer-537-frontend-ci

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ant-design-pro
    env:
      CI: "true"
      HUSKY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ant-design-pro/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --include=dev
      - name: Lint and type-check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
