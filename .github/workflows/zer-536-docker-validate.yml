name: ZER-536 Docker build validate

on:
  push:
    branches:
      - codexweb/zer-536-ai-config-connectivity

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag outlook-email-plus:zer-536 .
